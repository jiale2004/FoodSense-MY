<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodSense-MY</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <h1>FoodSense-MY</h1>
      <p class="subtitle">Malaysian Food Detection &amp; Nutritional Advisory</p>
    </div>
  </header>

  <main class="container">
    <section class="upload-section">
      <div id="drop-zone" class="drop-zone">
        <div class="drop-zone-content">
          <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <p>Drag &amp; drop a food image here</p>
          <p class="hint">or</p>
          <label for="file-input" class="btn btn-secondary">Choose File</label>
          <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" hidden>
          <p class="hint">JPEG, PNG, or WebP — max 10 MB</p>
        </div>
        <img id="preview" class="preview hidden" alt="Preview">
      </div>

      <button id="analyze-btn" class="btn btn-primary" disabled>Analyze Food</button>
    </section>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Analyzing your image...</p>
    </div>

    <div id="error" class="error hidden"></div>

    <section id="results" class="results hidden">
      <h2>Results</h2>
      <p id="processing-time" class="processing-time"></p>

      <div id="detections" class="card-grid"></div>

      <div id="nutrition" class="card-grid"></div>

      <div class="advisory-card">
        <h3>Nutritional Advisory</h3>
        <p id="advisory-text"></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>For informational purposes only — not medical advice. Consult a healthcare professional for dietary guidance.</p>
    </div>
  </footer>

  <script src="/js/app.js"></script>
</body>
</html>
